<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site Under Maintenance — Hyce</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #333;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 40px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 420px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
    }
    p {
      margin: 6px 0;
      font-size: 16px;
      line-height: 1.45;
    }
    .highlight {
      color: #090;
      font-weight: 600;
    }
    .small {
      font-size: 13px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Site is under maintenance</h1>
    <p><span class="highlight">Tasks will be back soon!</span></p>
    <p>Please bear with us.</p>
    <div class="small">We'll be back shortly — thank you for your patience.</div>
  </div>
</body>
</html>
