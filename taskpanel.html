<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYCE Sites</title>
<style>
:root{
  --bg1:#0f172a;
  --bg2:#020617;
  --line:rgba(139,92,246,.24);
  --glow:rgba(124,58,237,.24);
  --text:#fff;
  --muted:#cbd5e1;
  --btn1:#7c3aed;
  --btn2:#22c55e;
  --done1:#16a34a;
  --done2:#22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#111827,#020617 60%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 20% 20%,rgba(124,58,237,.16),transparent 28%),
    radial-gradient(circle at 80% 10%,rgba(34,197,94,.12),transparent 24%),
    radial-gradient(circle at 50% 80%,rgba(59,130,246,.08),transparent 30%);
  pointer-events:none;
  filter:blur(4px);
}
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:rgba(2,6,23,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  z-index:50;
}
.hamburger{
  font-size:26px;
  cursor:pointer;
  user-select:none;
  line-height:1;
}
.topbar-title{
  font-weight:700;
  font-size:15px;
  letter-spacing:.3px;
}
.page{
  max-width:1100px;
  margin:0 auto;
  padding:22px 16px 40px;
  position:relative;
  z-index:1;
}
.hero{
  padding:10px 4px 18px;
}
.hero h1{
  margin:0 0 8px;
  font-size:28px;
}
.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.6;
  max-width:760px;
}
.list{
  display:grid;
  gap:14px;
  margin-top:18px;
}
.site-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:16px 18px;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(17,24,39,.88),rgba(2,6,23,.92));
  border:1px solid var(--line);
  box-shadow:0 12px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(10px);
  transition:.25s ease;
  position:relative;
  overflow:hidden;
}
.site-card:hover{
  transform:translateY(-3px);
  border-color:rgba(139,92,246,.48);
  box-shadow:0 16px 34px rgba(0,0,0,.28),0 0 24px var(--glow);
}
.site-meta{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.site-badge{
  width:48px;
  height:48px;
  border-radius:16px;
  flex:0 0 48px;
  background:linear-gradient(135deg,rgba(124,58,237,.95),rgba(34,197,94,.8));
  display:grid;
  place-items:center;
  font-size:18px;
  box-shadow:0 0 18px rgba(124,58,237,.35);
}
.site-text{
  min-width:0;
}
.site-text b{
  display:block;
  font-size:15px;
  margin-bottom:4px;
}
.site-text span{
  display:block;
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
}
.view-btn{
  border:none;
  cursor:pointer;
  color:#fff;
  font-weight:700;
  font-size:13px;
  padding:11px 16px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--btn1),var(--btn2));
  box-shadow:0 10px 22px rgba(124,58,237,.2);
  transition:.2s ease;
  white-space:nowrap;
  flex:0 0 auto;
}
.view-btn:hover{
  transform:scale(1.04);
  box-shadow:0 0 16px rgba(124,58,237,.5);
}
.view-btn:active{
  transform:scale(.98);
}
.view-btn.completed{
  background:linear-gradient(90deg,var(--done1),var(--done2));
  box-shadow:0 10px 22px rgba(34,197,94,.22);
}
.footer-note{
  margin-top:18px;
  color:rgba(255,255,255,.55);
  font-size:12px;
  padding:0 4px;
}
@media(max-width:640px){
  .hero h1{font-size:24px}
  .site-card{padding:14px;gap:12px}
  .site-meta{gap:12px}
  .site-badge{width:44px;height:44px;border-radius:14px}
  .view-btn{padding:10px 14px;font-size:12px}
}
@media(max-width:480px){
  .site-card{flex-direction:column;align-items:stretch}
  .site-meta{width:100%}
  .view-btn{width:100%}
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="hamburger">☰</div>
    <div class="topbar-title">HYCE Elite</div>
  </div>

  <main class="page">
    <section class="hero">
      <h1>Post List</h1>
      <p>Click the buttons below to start. ‼️Avoid Cheating, as it will result in payment denial‼️</p>
    </section>

    <section class="list" id="siteList"></section>

    <div class="footer-note">Viewing the posts and not completing signup/installation is highly prohibited! and can lead to not been Paid!.</div>
  </main>

<script>
// ========== EXPANDED TO 10 SITES (but ONLY FIRST 2 ARE DISPLAYED) ==========
const sites = [
  { name: "Task A", url: "https://www.facebook.com/share/1BaN6Ha4BE/?mibextid=wwXIfr" },
  { name: "Task B", url: "https://www.facebook.com/share/1BaN6Ha4BE/?mibextid=wwXIfr" },
  { name: "Site 3", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 4", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 5", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 6", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 7", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 8", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 9", url: "https://naijanewsdfr.blogspot.com/p/window.html" },
  { name: "Site 10", url: "https://naijanewsdfr.blogspot.com/p/window.html" }
];

const list = document.getElementById('siteList');
// Only use the first 2 sites from the array
const firstTwoSites = sites.slice(0, 2);

list.innerHTML = firstTwoSites.map((site, index) => {
  // Different instructions: first 2 tasks get signup instruction
  let instruction;
  if (index < 2) {
    instruction = "View the Facebook post and signup/install App";
  } else {
    instruction = "View the site and Navigate for 30 seconds";
  }
  
  return `
  <article class="site-card">
    <div class="site-meta">
      <div class="site-badge">${index + 1}</div>
      <div class="site-text">
        <b>${site.name}</b>
        <span>${instruction}</span>
      </div>
    </div>
    <button class="view-btn" onclick="openSite(${index}, this)">View Post</button>
  </article>
  `;
}).join('');

function openSite(index, btn){
  // Since we only have first 2 sites, index will be 0 or 1
  const site = firstTwoSites[index];
  if(!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;

  btn.textContent = 'Opening...';
  btn.disabled = true;

  setTimeout(() => {
    if(site.url && site.url !== '#'){
      window.open(site.url, '_blank');
    }
  }, 300);

  setTimeout(() => {
    btn.textContent = 'Completed';
    btn.classList.add('completed');
    btn.disabled = true;
  }, 30000);
}
</script>
</body>
</html>
